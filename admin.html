<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NASHO | Birth Certificate Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;font-family:Arial;color:#172033}.head{background:#003b70;color:#fff;padding:15px 22px;display:flex;justify-content:space-between}.wrap{max-width:1200px;margin:20px auto;padding:0 15px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card,.panel{background:#fff;border-radius:12px;padding:20px;box-shadow:0 3px 14px #0001}.num{font-size:30px;font-weight:800}.search{display:flex;gap:10px;margin:20px 0}.search input{flex:1;padding:13px;border:1px solid #ccd4df;border-radius:8px}.btn{border:0;padding:12px 17px;border-radius:8px;background:#003b70;color:#fff;font-weight:bold;cursor:pointer}.green{background:#16833b}.red{background:#b42318}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid input{width:100%;padding:11px;border:1px solid #ccd4df;border-radius:7px}.result{margin-top:15px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #ddd;text-align:left;font-size:13px}.login{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center}.loginbox{width:min(400px,92%);padding:30px;background:#fff;box-shadow:0 10px 30px #0002;border-radius:14px}.loginbox input{width:100%;padding:13px;margin:7px 0;border:1px solid #ccc;border-radius:7px}.hidden{display:none!important}@media(max-width:700px){.cards,.grid{grid-template-columns:1fr}.search{flex-direction:column}}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><h2>NASHO Birth Certificate Admin</h2><input id="au" placeholder="Admin username"><input id="ap" type="password" placeholder="Admin password"><button class="btn" style="width:100%" onclick="adminLogin()">LOGIN</button><p id="msg"></p></div></div>
<div id="app" class="hidden"><div class="head"><b>NASHO BIRTH CERTIFICATE ADMIN</b><button class="btn red" onclick="location.reload()">Logout</button></div>
<div class="wrap"><div class="cards"><div class="card">Pending<div class="num" id="pending">0</div></div><div class="card">Verified<div class="num" id="verified">0</div></div><div class="card">Total<div class="num" id="total">0</div></div></div>
<div class="panel" style="margin-top:20px"><h2>Find Certificate</h2><div class="search"><input id="search" placeholder="Application Number or Mother's Phone"><button class="btn" onclick="searchRecord()">SEARCH</button></div><div id="results"></div></div>
<div class="panel" id="editPanel" style="margin-top:20px;display:none"><h2>Administrative Verification</h2><p id="recordInfo"></p><div class="grid"><div><label>Application Number</label><input id="applicationNumber"></div><div><label>NIN</label><input id="nin"></div><div><label>Auto-Gen Code</label><input id="autoGen" readonly></div></div><br><button class="btn green" onclick="verify()">SAVE & VERIFY</button></div>
</div></div>
<script>
const API_URL="PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";let token="",selected=null;
function api(action,data={}){return fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,...data})}).then(r=>r.json())}
async function adminLogin(){try{let r=await api("adminLogin",{username:au.value,password:ap.value});if(r.success){token=r.token;login.classList.add("hidden");app.classList.remove("hidden");loadStats()}else msg.textContent=r.message||"Invalid login"}catch(e){msg.textContent="Server connection error"}}
async function loadStats(){let r=await api("stats",{token});if(r.success){pending.textContent=r.pending;verified.textContent=r.verified;total.textContent=r.total}}
async function searchRecord(){let q=search.value.trim();if(!q)return;let r=await api("adminSearch",{token,query:q});if(!r.success){results.innerHTML="<p>No record found.</p>";editPanel.style.display="none";return}selected=r.record;results.innerHTML=`<table class="table"><tr><th>Child</th><th>Mother</th><th>Mother Phone</th><th>Status</th></tr><tr><td>${e(selected.childName)}</td><td>${e(selected.motherName)}</td><td>${e(selected.motherPhone)}</td><td>${e(selected.status)}</td></tr></table>`;recordInfo.textContent=`Child: ${selected.childName} | Mother: ${selected.motherName} | DOB: ${selected.dob}`;applicationNumber.value=selected.applicationNumber||"";nin.value=selected.nin||"";autoGen.value=selected.autoGen||"";editPanel.style.display="block"}
async function verify(){if(!selected)return;if(!applicationNumber.value.trim()||!nin.value.trim()){alert("Application Number and NIN are required.");return}let r=await api("verifyBirth",{token,id:selected.id,applicationNumber:applicationNumber.value.trim(),nin:nin.value.trim()});if(r.success){alert("Certificate verified successfully.");autoGen.value=r.autoGen;loadStats();searchRecord()}else alert(r.message||"Could not verify")}
function e(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
</script></body></html>
